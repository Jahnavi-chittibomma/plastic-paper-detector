<!DOCTYPE html>
<html>
<head>
    <title>Plastic/Paper Detector + Scratch Card Reward</title>

    <!-- Tensorflow + Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

    <!-- QR Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

    <style>
        body {
            font-family: Poppins, sans-serif;
            text-align: center;
            background: black;
            color: white;
        }

        #live-view {
            width: 224px;
            height: 224px;
            margin: 10px auto;
        }

        #scratch-section {
            display: none;
            margin-top: 20px;
        }

        /* Scratch Card Styling */
        .card-container {
          text-align: center;
        }

        .card {
          width: 320px;
          height: 200px;
          background: linear-gradient(135deg, #2a2a2a, #1a1a1a);
          border-radius: 18px;
          position: relative;
          overflow: hidden;
          box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
          border: 2px solid rgba(255, 215, 0, 0.35);
          display: flex;
          justify-content: center;
          align-items: center;
          margin: auto;
        }

        .gold-text {
          font-size: 28px;
          font-weight: 700;
          background: linear-gradient(90deg, #ffdd55, #ffbf00, #ffe38a);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        canvas {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          border-radius: 18px;
        }

    </style>
</head>
<body>

<h1>Plastic vs Paper Detector</h1>

<!-- Model Inputs -->
<input type="file" id="model-file" accept=".json" />
<input type="file" id="weights-file" accept=".bin" />
<input type="file" id="metadata-file" accept=".json" />
<br>
<button onclick="init()">Load Model & Start Camera</button>

<div id="live-view"></div>
<h2 id="detected-object">Show Plastic or Paper</h2>

<!-- QR Section -->
<h3 id="qr-text" style="display:none;">Scan the QR Code</h3>
<canvas id="qrCanvas" width="200" height="200" style="display:none;"></canvas>

<!-- Scratch Card Section -->
<div id="scratch-section" class="card-container">
    <div class="card">
      <div id="result" class="gold-text"></div>
      <canvas id="scratch"></canvas>
    </div>
</div>


<script>
/* ---------------- MODEL + QR SECTION ---------------- */
let model, webcam, maxPredictions;

let qr = null;
let qrVisible = false;
let lastType = "";
const CONFIDENCE = 0.90;

async function init() {
    const modelFile = document.getElementById('model-file').files[0];
    const weightsFile = document.getElementById('weights-file').files[0];
    const metadataFile = document.getElementById('metadata-file').files[0];

    if (!modelFile || !weightsFile || !metadataFile) {
        alert("Please select all model files first.");
        return;
    }

    model = await tmImage.loadFromFiles(modelFile, weightsFile, metadataFile);
    maxPredictions = model.getTotalClasses();

    webcam = new tmImage.Webcam(224, 224, true);
    await webcam.setup();
    await webcam.play();

    document.getElementById("live-view").appendChild(webcam.canvas);

    qr = new QRious({
        element: document.getElementById("qrCanvas"),
        size: 200,
        value: ""
    });

    window.requestAnimationFrame(loop);
}

async function loop() {
    webcam.update();
    await predict();
    window.requestAnimationFrame(loop);
}

async function predict() {
    if (qrVisible) return;

    const predictions = await model.predict(webcam.canvas);

    let best = predictions[0];
    for (let p of predictions) {
        if (p.probability > best.probability) best = p;
    }

    document.getElementById("detected-object").innerText = best.className;

    const type = best.className.toUpperCase();

    if (best.probability >= CONFIDENCE && (type === "PLASTIC" || type === "PAPER")) {
        if (lastType !== type) {
            lastType = type;
            showQR(type);
        }
    }
}

function showQR(type) {
    qrVisible = true;

    const coupon = makeCode();
    const link = "https://example.com/reward?coupon=" + coupon;

    qr.value = link;

    document.getElementById("qrCanvas").style.display = "block";
    document.getElementById("qr-text").style.display = "block";

    setTimeout(() => {
        document.getElementById("qrCanvas").style.display = "none";
        document.getElementById("qr-text").style.display = "none";
        qrVisible = false;

        showScratchCard();

    }, 5000);
}

function makeCode() {
    const chars = "ABCDEFGH0123456789";
    let code = "";
    for (let i = 0; i < 10; i++) {
        code += chars[Math.floor(Math.random() * chars.length)];
    }
    return code;
}

/* ---------------- SCRATCH CARD SECTION ---------------- */

const MIN = 5;
const MAX = 50;
const BAD_CHANCE = 0.25;

let canvas = document.getElementById("scratch");
let ctx = canvas.getContext("2d");
let resultBox = document.getElementById("result");
let isDrawing = false;

function randomPrize() {
    if (Math.random() < BAD_CHANCE) return "Better luck next time";

    let coins = Math.floor(Math.random() * (MAX - MIN + 1)) + MIN;
    return coins + " Coins!";
}

function drawOverlay() {
    const w = canvas.width = canvas.offsetWidth;
    const h = canvas.height = canvas.offsetHeight;

    let g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, "#ccc");
    g.addColorStop(1, "#aaa");

    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.font = "22px Poppins";
    ctx.textAlign = "center";
    ctx.fillText("Scratch", w/2, h/2);
}

function showScratchCard() {
    document.getElementById("scratch-section").style.display = "block";

    resultBox.textContent = randomPrize();
    drawOverlay();
}

canvas.addEventListener("mousedown", () => isDrawing = true);
canvas.addEventListener("mouseup", () => isDrawing = false);
canvas.addEventListener("mousemove", scratch);

canvas.addEventListener("touchstart", () => isDrawing = true);
canvas.addEventListener("touchend", () => isDrawing = false);
canvas.addEventListener("touchmove", scratch);

function scratch(e) {
    if (!isDrawing) return;

    let rect = canvas.getBoundingClientRect();
    let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    let y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(x, y, 25, 0, Math.PI * 2);
    ctx.fill();
}

</script>

</body>
</html>
